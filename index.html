<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Presensi Shalat</title>

  <link rel="stylesheet" href="style.css">

  <!-- QR CODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>

<body>

  <!-- =========================
       HALAMAN AWAL
  ========================== -->
  <section id="pageRole" class="page active">

    <div class="container">

      <h1>Presensi Shalat</h1>
      <p class="subtitle">SMAN 2 Rangkasbitung</p>

      <div class="role-container">

        <button class="role-btn"
                onclick="showGuruLogin()">
          👨‍🏫
          <span>Guru</span>
        </button>

        <button class="role-btn"
                onclick="showUmumPage()">
          👥
          <span>Pengguna Umum</span>
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       LOGIN GURU
  ========================== -->
  <section id="pageLogin" class="page">

    <div class="container">

      <h2>Login Guru</h2>

      <input
        type="text"
        id="username"
        placeholder="Username">

      <input
        type="password"
        id="password"
        placeholder="Password">

      <button
        class="main-btn"
        onclick="loginGuru()">
        LOGIN
      </button>

      <button
        class="secondary-btn"
        onclick="showRolePage()">
        KEMBALI
      </button>

    </div>

  </section>


  <!-- =========================
       HALAMAN GURU
  ========================== -->
  <section id="pageGuru" class="page">

    <div class="container">

      <div class="top-header">

        <div>
          <h2>Presensi Shalat</h2>
          <p id="namaGuru"></p>
        </div>

        <button
          class="logout-btn"
          onclick="logoutGuru()">
          Keluar
        </button>

      </div>


      <!-- TANGGAL -->
      <label>Tanggal Presensi</label>

      <input
        type="date"
        id="tanggal">


      <!-- JENIS SHALAT -->
      <label>Jenis Shalat</label>

      <div class="radio-group">

        <label>
          <input
            type="radio"
            name="jenisShalat"
            value="Dhuha"
            checked>
          Dhuha
        </label>

        <label>
          <input
            type="radio"
            name="jenisShalat"
            value="Dhuhur">
          Dhuhur
        </label>

        <label>
          <input
            type="radio"
            name="jenisShalat"
            value="Ashar">
          Ashar
        </label>

      </div>


      <!-- STATUS -->
      <label>Status</label>

      <div class="radio-group">

        <label>
          <input
            type="radio"
            name="status"
            value="Hadir"
            checked>
          Hadir
        </label>

        <label>
          <input
            type="radio"
            name="status"
            value="Haid">
          Haid
        </label>

      </div>


      <!-- BUTTON SCAN -->
      <button
        id="btnScan"
        class="scan-btn"
        onclick="mulaiScan()">
        📷 MULAI SCAN QR CODE
      </button>


      <!-- STOP CAMERA -->
      <button
        id="btnStopScan"
        class="secondary-btn"
        onclick="stopScan()"
        style="display:none;">
        ⛔ STOP KAMERA
      </button>


      <!-- SCANNER -->
      <div id="scannerContainer">

        <div id="reader"></div>

      </div>


      <!-- STATUS SCANNER -->
      <div
        id="scannerStatus"
        class="scanner-status">
        Kamera belum aktif
      </div>


      <!-- SISWA TERAKHIR -->
      <div
        id="lastStudent"
        class="last-student"
        style="display:none;">

        <h3>Presensi Terakhir</h3>

        <div id="lastStudentName"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       HALAMAN UMUM
  ========================== -->
  <section id="pageUmum" class="page">

    <div class="container">

      <h2>Rekap Presensi</h2>

      <div class="menu-container">

        <button
          onclick="showRekapHarian()">
          📅 Rekap Harian
        </button>

        <button
          onclick="showRekapPersentase()">
          📊 Persentase Presensi
        </button>

        <button
          onclick="showRekapSiswa()">
          👤 Rekap Per Siswa
        </button>

      </div>


      <button
        class="secondary-btn"
        onclick="showRolePage()">
        KEMBALI
      </button>

    </div>

  </section>


  <!-- =========================
       REKAP HARIAN
  ========================== -->
  <section id="pageRekapHarian" class="page">

    <div class="container">

      <h2>Rekap Harian</h2>

      <label>Tanggal</label>

      <input
        type="date"
        id="rekapTanggal">

      <label>Kelas</label>

      <select id="rekapKelas">
        <option value="">Semua Kelas</option>
      </select>

      <label>Shalat</label>

      <select id="rekapShalat">

        <option value="Dhuha">Dhuha</option>
        <option value="Dhuhur">Dhuhur</option>
        <option value="Ashar">Ashar</option>

      </select>

      <button
        class="main-btn"
        onclick="loadRekapHarian()">
        TAMPILKAN
      </button>

      <div id="hasilRekapHarian"></div>

      <button
        class="secondary-btn"
        onclick="showUmumPage()">
        KEMBALI
      </button>

    </div>

  </section>


  <!-- =========================
       PERSENTASE
  ========================== -->
  <section id="pageRekapPersentase" class="page">

    <div class="container">

      <h2>Persentase Presensi</h2>

      <label>Bulan</label>

      <input
        type="month"
        id="periodePersentase">

      <label>Kelas</label>

      <select id="kelasPersentase">
        <option value="">Semua Kelas</option>
      </select>

      <label>Shalat</label>

      <select id="shalatPersentase">

        <option value="">Semua</option>
        <option value="Dhuha">Dhuha</option>
        <option value="Dhuhur">Dhuhur</option>
        <option value="Ashar">Ashar</option>

      </select>

      <button
        class="main-btn"
        onclick="loadRekapPersentase()">
        TAMPILKAN
      </button>

      <div id="hasilRekapPersentase"></div>

      <button
        class="secondary-btn"
        onclick="showUmumPage()">
        KEMBALI
      </button>

    </div>

  </section>


  <!-- =========================
       REKAP PER SISWA
  ========================== -->
  <section id="pageRekapSiswa" class="page">

    <div class="container">

      <h2>Rekap Presensi Per Siswa</h2>

      <label>Siswa</label>

      <select id="siswaRekap">

        <option value="">
          Pilih Siswa
        </option>

      </select>

      <label>Bulan</label>

      <input
        type="month"
        id="periodeSiswa">

      <button
        class="main-btn"
        onclick="loadRekapSiswa()">
        TAMPILKAN
      </button>

      <div id="hasilRekapSiswa"></div>

      <button
        class="secondary-btn"
        onclick="showUmumPage()">
        KEMBALI
      </button>

    </div>

  </section>


  <!-- =========================
       NOTIFIKASI
  ========================== -->

  <div
    id="floatingNotification"
    class="floating-notification">
  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
